# Prod stack on the VM: docker compose -f docker-compose.prod.yml up -d --build
# Secrets come from .env.prod (copy .env.prod.example).
name: shopwith-prod # own project name, so its containers and volume never collide with the dev stack
services:
  db:
    image: postgres:17
    env_file: .env.prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: prod
    env_file: .env.prod
    ports:
      - "3000:3000" # restrict to the Pi's IP in the Proxmox firewall; Docker bypasses ufw
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
