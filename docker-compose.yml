# Dev stack. Prod: docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: shopwith
      POSTGRES_PASSWORD: shopwith
      POSTGRES_DB: shopwith
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopwith"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    environment:
      DATABASE_URL: postgresql://shopwith:shopwith@db:5432/shopwith
      PORT: "3000"
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules # keep the container's own node_modules (native argon2 build)
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
